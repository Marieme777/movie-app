<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéExplore - Votre Guide Cinéma</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Icônes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark bg-black py-3 border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger fs-3" href="#"><i class="fa-solid fa-film me-2"></i>CinéExplore</a>
            <div class="d-flex" role="search">
                <input id="searchInput" class="form-control me-2 bg-secondary text-light border-0" type="search" placeholder="Rechercher un film..." aria-label="Search">
            </div>
        </div>
    </nav>

    <!-- Banner / Hero Section -->
    <header class="py-5 text-center bg-black bg-gradient mb-4">
        <div class="container">
            <h1 class="display-4 fw-bold">Découvrez les meilleurs films</h1>
            <p class="lead text-secondary">Explorez les tendances, recherchez vos films préférés et consultez les détails.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mb-5">
        <!-- Genres Filter -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" id="genreFilters">
            <button class="btn btn-outline-danger active filter-btn" data-genre="all">Tous</button>
            <button class="btn btn-outline-danger filter-btn" data-genre="Action">Action</button>
            <button class="btn btn-outline-danger filter-btn" data-genre="Sci-Fi">S-F</button>
            <button class="btn btn-outline-danger filter-btn" data-genre="Drame">Drame</button>
            <button class="btn btn-outline-danger filter-btn" data-genre="Aventure">Aventure</button>
        </div>

        <!-- Movie Cards Container -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="movieGrid">
            <!-- Les cartes de films seront injectées dynamiquement par JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-center text-secondary py-3 border-top border-secondary">
        <p class="m-0">&copy; 2026 CinéExplore. Développé avec ❤️ pour le Checkpoint.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>s
